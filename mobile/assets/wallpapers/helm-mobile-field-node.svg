<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090d"/>
      <stop offset="45%" stop-color="#0a1016"/>
      <stop offset="100%" stop-color="#030507"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1822" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1822" stop-opacity="0.00"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="microgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#16303c" stroke-width="1" stroke-opacity="0.28"/>
    </pattern>

    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" y="0" fill="#9fdfff" opacity="0.028"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#microgrid)"/>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>

  <path d="M0 850 C 350 770, 760 760, 1120 820 C 1400 865, 1650 840, 1920 760" fill="none" stroke="#12384a" stroke-width="2" stroke-opacity="0.35"/>
  <path d="M0 900 C 280 860, 600 860, 920 910 C 1230 960, 1540 920, 1920 860" fill="none" stroke="#103240" stroke-width="1.5" stroke-opacity="0.28"/>
  <path d="M0 930 C 250 920, 570 930, 840 970 C 1110 1010, 1500 1000, 1920 940" fill="none" stroke="#0e2934" stroke-width="1.2" stroke-opacity="0.22"/>

  <g stroke="#67d6ff" stroke-opacity="0.65" fill="none" filter="url(#softGlow)">
    <path d="M84 92 H510" stroke-width="2"/>
    <path d="M84 108 H366" stroke-width="1"/>
    <circle cx="62" cy="100" r="4" fill="#67d6ff"/>
  </g>

  <g font-family="JetBrains Mono, monospace" fill="#9adfff">
    <text x="84" y="66" font-size="18" letter-spacing="3" opacity="0.92">HELM MOBILE NODE</text>
    <text x="84" y="142" font-size="12" letter-spacing="2" opacity="0.56">FIELD TERMINAL / THINKPAD T14 / MOBILE CYBERDECK</text>
  </g>

  <g transform="translate(1320 92)">
    <rect x="0" y="0" width="516" height="148" rx="8" fill="#071018" fill-opacity="0.52" stroke="#1d5164" stroke-opacity="0.55"/>
    <g font-family="JetBrains Mono, monospace" fill="#9adfff">
      <text x="26" y="34" font-size="13" letter-spacing="2" opacity="0.78">STATUS // FIELD READY</text>
      <text x="26" y="64" font-size="12" opacity="0.62">LINK: SECURE</text>
      <text x="26" y="88" font-size="12" opacity="0.62">CORE: MOBILE NODE</text>
      <text x="26" y="112" font-size="12" opacity="0.62">MODE: STEALTH-CAPABLE</text>
      <text x="26" y="136" font-size="12" opacity="0.62">SIGNATURE: LOW VISIBILITY</text>
    </g>

    <g stroke="#67d6ff" stroke-opacity="0.64">
      <line x1="330" y1="32" x2="476" y2="32" stroke-width="2"/>
      <line x1="330" y1="60" x2="454" y2="60" stroke-width="1.4"/>
      <line x1="330" y1="88" x2="494" y2="88" stroke-width="1.4"/>
      <line x1="330" y1="116" x2="418" y2="116" stroke-width="1.4"/>
    </g>
  </g>

  <g transform="translate(90 820)">
    <rect x="0" y="0" width="486" height="170" rx="8" fill="#071018" fill-opacity="0.48" stroke="#1a4d60" stroke-opacity="0.44"/>
    <g font-family="JetBrains Mono, monospace" fill="#9adfff">
      <text x="24" y="32" font-size="13" letter-spacing="2" opacity="0.78">NETRUNNER FIELD SHELL</text>
      <text x="24" y="62" font-size="12" opacity="0.56">Minimal mobile workstation profile</text>
      <text x="24" y="86" font-size="12" opacity="0.56">Low-noise visual layer</text>
      <text x="24" y="110" font-size="12" opacity="0.56">Compact HUD / battery-first / stealth aesthetic</text>
      <text x="24" y="146" font-size="11" opacity="0.38">CYBERDECK-LAPTOP // HELM // FIELD NODE</text>
    </g>
  </g>

  <g transform="translate(1440 860)" stroke="#67d6ff" stroke-opacity="0.34" fill="none">
    <circle cx="120" cy="82" r="78" stroke-width="1.2"/>
    <circle cx="120" cy="82" r="54" stroke-width="1"/>
    <path d="M120 4 V160 M42 82 H198" stroke-width="1"/>
    <path d="M73 35 L167 129 M73 129 L167 35" stroke-width="0.8" opacity="0.6"/>
  </g>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#scan)"/>
</svg>
