name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app modules services
      - name: Validate JSON configuration
        run: python -c 'import json, pathlib; [json.load(p.open()) for p in pathlib.Path("config").glob("*.json")]'
