conky.config = {
    alignment = 'top_right',
    background = false,
    double_buffer = true,
    update_interval = 1.0,
    total_run_times = 0,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'HELMMobileNode',
    own_window_title = 'HELM // MOBILE NODE',
    own_window_argb_visual = true,
    own_window_argb_value = 188,
    own_window_colour = '02070B',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,

    use_xft = true,
    xftalpha = 1.0,
    font = 'Hack:size=10',

    default_color = 'B9DCE4',
    color1 = '42E8FF',
    color2 = '537B86',
    color3 = '58F6D0',
    color4 = 'FFBD59',
    color5 = 'F3FCFF',

    gap_x = 24,
    gap_y = 24,
    minimum_width = 310,
    maximum_width = 310,
    minimum_height = 0,
    border_inner_margin = 14,
    border_outer_margin = 0,
    default_bar_height = 5,
    default_bar_width = 282,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    use_spacer = 'none',
    max_text_width = 0,
    text_buffer_size = 4096,
    override_utf8_locale = true,
};

conky.text = [[
${color1}${font Hack:bold:size=11}◈ H E L M${alignr}MOBILE NODE${font}${color}
${color2}${hr 1}${color}
${font Hack:bold:size=22}${color5}${time %H:%M:%S}${font}${alignr}${color2}${time %a // %d %b %Y}${color}

${color2}CORE FABRIC${alignr}${execpi 2 ~/.local/bin/helm-mobile-status helm}${color}
${color2}HOST${alignr}${color5}$nodename${color}
${color2}OS NODE${alignr}${color1}ARCH // KDE${color}

${color2}${hr 1}${color}
${color1}CPU CORE${alignr}${color5}${cpu cpu0}%${color2} // ${execi 5 ~/.local/bin/helm-mobile-status cpu-temp}°C${color}
${color1}${cpubar cpu0 5,282}${color}

${voffset 3}${color1}MEMORY${alignr}${color5}${memperc}%${color2} // $mem / $memmax${color}
${color1}${membar 5,282}${color}

${voffset 3}${color1}GPU CORE${alignr}${color5}${execi 2 ~/.local/bin/helm-mobile-status gpu-util}%${color2} // ${execi 5 ~/.local/bin/helm-mobile-status gpu-temp}°C${color}
${color1}${execibar 2 5,282 ~/.local/bin/helm-mobile-status gpu-util}${color}

${color2}${hr 1}${color}
${execpi 2 ~/.local/bin/helm-mobile-status power}
${color1}${execibar 2 5,282 ~/.local/bin/helm-mobile-status battery-percent}${color}

${color2}${hr 1}${color}
${execpi 1 ~/.local/bin/helm-mobile-status network}

${color2}${hr 1}${color}
${color1}ROOT STORAGE${alignr}${color5}${fs_used_perc /}%${color2} // ${fs_free /} FREE${color}
${color1}${fs_bar 5,282 /}${color}
${voffset 3}${color2}UPTIME${alignr}${color5}${uptime_short}${color}
${color2}KERNEL${alignr}${color5}${kernel}${color}

${voffset 4}${color2}HELM CYBERDECK OS // MOBILE NODE 02${color}
]];
